name: Composer lock update

on:
  schedule:
    # Weekly, Monday at 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: composer-lock-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Validate Composer manifest
        working-directory: home/.config/composer
        run: composer validate --no-check-publish

      - name: Update dependencies
        working-directory: home/.config/composer
        run: |
          cp composer.lock composer.lock.before-update
          composer update --no-interaction --no-progress --prefer-dist --no-install

      - name: Enforce a one-day minimum release age
        working-directory: home/.config/composer
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def packages(lock):
              return {
                  package["name"]: package
                  for section in ("packages", "packages-dev")
                  for package in lock.get(section, [])
              }

          before = packages(json.loads(Path("composer.lock.before-update").read_text()))
          after = packages(json.loads(Path("composer.lock").read_text()))
          cutoff = datetime.now(timezone.utc) - timedelta(days=1)
          too_new = []

          for name, package in after.items():
              previous = before.get(name)
              if previous and previous.get("version") == package.get("version"):
                  continue
              released_at = package.get("time")
              if not released_at:
                  too_new.append(f"{name} {package['version']} (missing release timestamp)")
                  continue
              released = datetime.fromisoformat(released_at.replace("Z", "+00:00"))
              if released > cutoff:
                  too_new.append(f"{name} {package['version']} ({released_at})")

          if too_new:
              print("Refusing package releases younger than 24 hours:")
              print("\n".join(f"- {item}" for item in too_new))
              raise SystemExit(1)
          print("All changed package releases are at least 24 hours old.")
          PY
          rm composer.lock.before-update

      - name: Revalidate lock file
        working-directory: home/.config/composer
        run: composer validate --no-check-publish

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/composer-lock-update
          delete-branch: true
          commit-message: "chore(deps): update Composer lock file"
          title: "chore(deps): update Composer lock file"
          body: |
            ## Summary
            - Runs the weekly `composer update` for `home/.config/composer`.
            - Includes only changed package releases that are at least 24 hours old.

            Generated by the Composer lock update workflow.
          add-paths: |
            home/.config/composer/composer.lock
